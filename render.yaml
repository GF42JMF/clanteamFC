services:
  - type: web
    name: clanteamfc-club
    runtime: node
    plan: free
    branch: codex/club-original-2027
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build
    startCommand: node server/index.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://qpraaostmojllbgfczox.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CLAN_ADMIN_USERNAME
        value: admin
      - key: CLAN_ADMIN_EMAIL
        sync: false
      - key: CLAN_ADMIN_PASSWORD
        sync: false
